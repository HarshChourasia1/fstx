[build-system]
requires = [
  "scikit-build-core>=0.10",
  "nanobind>=2.4",
]
build-backend = "scikit_build_core.build"

[project]
name = "fstx"
version = "1.0.0.dev0"
description = "Fast, safe column-store files (the FST-X format): Python on the fstx C++ engine"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Harsh Chourasia" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/HarshChourasia1/fstx"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.21"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
# One abi3 wheel for CPython 3.12 and later; 3.9 to 3.11 get an ordinary per-version wheel
# (nanobind needs 3.12 for the stable ABI; scikit-build-core ignores this key on older Pythons).
wheel.py-api = "cp312"
wheel.packages = ["fstx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
