# Docs site (https://harshchourasia1.github.io/fstx/): built from the repo's Markdown by .github/site/build_site.py
# and deployed to GitHub Pages. Needs Settings > Pages > Source = "GitHub Actions" (once).
name: site

on:
  push:
    branches: [main]
    paths:
      - README.md
      - NEWS.md
      - DESCRIPTION
      - python/README.md
      - inst/spec/fstx-format-1.2.md
      - .github/site/**
      - .github/readme/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install markdown
      - run: python .github/site/build_site.py _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
