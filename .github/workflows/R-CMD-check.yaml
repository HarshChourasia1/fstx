# R CMD check on GitHub Actions (r-lib/actions), plus the engine test program (tools/coretest) without R.
# Runs on push and pull request to main / master. Prepared only: not run yet (no GitHub access in 1.0).
# R 4.4 is the oldest R the package declares; macos-latest and ubuntu-24.04-arm are ARM64 machines.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,    r: 'release'}
          - {os: ubuntu-latest,    r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,    r: '4.4'}
          - {os: ubuntu-24.04-arm, r: 'release'}
          - {os: macos-latest,     r: 'release'}
          - {os: windows-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CRAN_INCOMING_REMOTE_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
          args: 'c("--no-manual", "--as-cran")'

  coretest:
    runs-on: ${{ matrix.os }}
    name: coretest ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the engine test program
        run: |
          make -C tools/coretest -j4
          mkdir -p "$RUNNER_TEMP/ct"
          tools/coretest/build/native/coretest "$RUNNER_TEMP/ct"
